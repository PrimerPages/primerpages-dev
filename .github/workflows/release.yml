name: Release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish or test (for example, 1.13.0)"
        required: true
        type: string

jobs:
  release-theme-repo:
    name: Release downstream theme repo
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create downstream theme release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          TARGET_REPO: PrimerPages/jekyll-theme-profile
          TARGET_BRANCH: main
        run: |
          set -euo pipefail

          NOTES_FILE="$(mktemp)"
          if [[ -n "${RELEASE_BODY:-}" ]]; then
            printf '%s\n' "$RELEASE_BODY" > "$NOTES_FILE"
          else
            printf 'Release %s\n\nPublished from PrimerPages/primerpages-dev.\n' "$RELEASE_TAG" > "$NOTES_FILE"
          fi

          RELEASE_TITLE="${RELEASE_NAME:-Release ${RELEASE_TAG}}"

          if gh release view "$RELEASE_TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh workflow run release.yml \
              --repo "$TARGET_REPO" \
              --ref "$TARGET_BRANCH" \
              -f version="${RELEASE_TAG#v}" \
              -f dry-run=false
          else
            gh release create "$RELEASE_TAG" \
              --repo "$TARGET_REPO" \
              --target "$TARGET_BRANCH" \
              --title "$RELEASE_TITLE" \
              --notes-file "$NOTES_FILE"
          fi

  wait-for-gem:
    name: Wait for gem availability
    needs: [release-theme-repo]
    runs-on: ubuntu-latest
    steps:
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.305.0
        with:
          ruby-version: "3.3.4"

      - name: Wait for RubyGems to serve the new version
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          set -euo pipefail

          VERSION="${RELEASE_VERSION#v}"
          ATTEMPTS=24
          SLEEP_SECONDS=10

          for attempt in $(seq 1 "$ATTEMPTS"); do
            rm -f "jekyll-theme-profile-${VERSION}.gem"

            if gem fetch jekyll-theme-profile --version "$VERSION" --clear-sources --source https://rubygems.org >/dev/null 2>&1; then
              echo "Gem jekyll-theme-profile ${VERSION} is available from RubyGems."
              exit 0
            fi

            echo "Attempt ${attempt}/${ATTEMPTS}: gem jekyll-theme-profile ${VERSION} is not available yet."
            sleep "$SLEEP_SECONDS"
          done

          echo "Timed out waiting for jekyll-theme-profile ${VERSION} to become available on RubyGems."
          exit 1

  update-downstream-repos:
    name: Tag downstream repositories
    needs: [release-theme-repo, wait-for-gem]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - repo: PrimerPages/primerpages-gh-pages
            branch: main
            path: primerpages-gh-pages
          - repo: PrimerPages/primerpages-minimal
            branch: main
            path: primerpages-minimal
          - repo: PrimerPages/primerpages-recommended
            branch: main
            path: primerpages-recommended
          - repo: PrimerPages/primerpages-docs
            branch: main
            path: primerpages-docs
          - repo: PrimerPages/primerpages.github.io
            branch: main
            path: primerpages.github.io

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.target.repo }}
          ref: ${{ matrix.target.branch }}
          token: ${{ secrets.CI_BOT_TOKEN }}
          path: ${{ matrix.target.path }}
          fetch-depth: 0

      - name: Create downstream release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          TARGET_REPO: ${{ matrix.target.repo }}
          TARGET_BRANCH: ${{ matrix.target.branch }}
        run: |
          set -euo pipefail

          NOTES_FILE="$(mktemp)"
          if [[ -n "${RELEASE_BODY:-}" ]]; then
            printf '%s\n' "$RELEASE_BODY" > "$NOTES_FILE"
          else
            printf 'Release %s\n\nPublished from PrimerPages/primerpages-dev.\n' "$RELEASE_TAG" > "$NOTES_FILE"
          fi

          RELEASE_TITLE="${RELEASE_NAME:-Release ${RELEASE_TAG}}"

          if gh release view "$RELEASE_TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$TARGET_REPO" \
              --title "$RELEASE_TITLE" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$TARGET_REPO" \
              --target "$TARGET_BRANCH" \
              --title "$RELEASE_TITLE" \
              --notes-file "$NOTES_FILE"
          fi
