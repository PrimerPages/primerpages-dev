{%- if site.search.enabled -%}
<dialog id="primerpages-search-dialog" class="primerpages-search-dialog color-bg-overlay box-shadow-large"
  aria-label="Search this site" data-pagefind-search
  data-pagefind-max-results="{{ site.search.max_results | default: 8 }}"
  data-pagefind-src="{{ '/pagefind/pagefind.js' | relative_url }}">
  <div class="primerpages-search-dialog__header">
    <label class="sr-only" for="primerpages-search-input">Search this site</label>
    <div class="primerpages-search__control position-relative flex-1">
      <span class="primerpages-search__icon octicon octicon-search-16" aria-hidden="true"></span>
      <input id="primerpages-search-input" class="primerpages-search__input form-control"
        type="search" role="combobox" autocomplete="off" spellcheck="false" placeholder="Search this site…"
        aria-autocomplete="list" aria-haspopup="listbox" aria-expanded="false"
        aria-controls="primerpages-search-results" autofocus data-pagefind-input>
    </div>
    <button class="btn-octicon" type="button" aria-label="Close search" data-pagefind-close>
      <span class="octicon octicon-x-16" aria-hidden="true"></span>
    </button>
  </div>
  <div class="primerpages-search__dropdown" hidden data-pagefind-dropdown>
    <div class="primerpages-search-dialog__section-label color-fg-muted" aria-hidden="true">Search this site</div>
    <div id="primerpages-search-results" role="listbox" aria-label="Search results" data-pagefind-results></div>
    <div class="primerpages-search__empty color-fg-muted" hidden data-pagefind-empty></div>
  </div>
  <div class="sr-only" role="status" aria-live="polite" aria-atomic="true" data-pagefind-status></div>
</dialog>
<script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
{%- endif -%}
